<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="An elf burglar in a mask sneaking off with the Christmas duck">
  <!-- striped burglar shirt -->
  <rect x="18" y="45" width="26" height="18" rx="7" fill="#2b2118"/>
  <path d="M19 51 H43 M19 57 H43" stroke="#fff" stroke-width="2.5"/>
  <!-- the stolen duck, tucked under the elf's arm -->
  <path d="M41 54 L37.5 49.5 L44.5 52 Z" fill="#f5c400"/>
  <ellipse cx="50" cy="56" rx="10" ry="6.5" fill="#ffd93b"/>
  <path d="M45 55 Q50 51 55 55 Q51 59 46 58 Z" fill="#f5c400"/>
  <circle cx="55" cy="47" r="5.5" fill="#ffd93b"/>
  <path d="M59.8 46.2 Q64 46.5 63.2 48.8 Q61.8 50.2 59.6 49.2 Z" fill="#f28c28"/>
  <circle cx="56.6" cy="45.8" r="1" fill="#2b2118"/>
  <path d="M50.5 51 Q55 53.5 59.5 50.5 L60 52.6 Q55 55.6 50.5 53.2 Z" fill="#c8102e"/>
  <path d="M50 43.4 Q52 36.5 58 38 Q61 39.5 60.2 43.4 Z" fill="#c8102e"/>
  <rect x="49.4" y="42.2" width="11.4" height="2.6" rx="1.3" fill="#fff"/>
  <circle cx="60.4" cy="38.6" r="1.6" fill="#fff" stroke="#d9cdbd" stroke-width=".6"/>
  <!-- elf hand holding the duck -->
  <circle cx="44" cy="55" r="2.6" fill="#f6cba2"/>
  <!-- ears -->
  <path d="M19 31 L5 24 L19 37 Z" fill="#f2c094"/>
  <path d="M45 31 L59 24 L45 37 Z" fill="#f2c094"/>
  <!-- face -->
  <circle cx="32" cy="33" r="14" fill="#f6cba2"/>
  <!-- cheeks -->
  <circle cx="23.5" cy="38" r="2.6" fill="#ff8fa3" opacity=".6"/>
  <circle cx="40.5" cy="38" r="2.6" fill="#ff8fa3" opacity=".6"/>
  <!-- elf hat -->
  <path d="M17 24 Q24 2 44 6 Q52 8 54 16 Q46 12 42 14 Q47 19 47 24 Z" fill="#1b6b45"/>
  <circle cx="54.5" cy="17" r="3.6" fill="#fff" stroke="#d9cdbd" stroke-width="1"/>
  <rect x="16" y="20" width="32" height="6" rx="3" fill="#c8102e"/>
  <!-- burglar mask -->
  <rect x="18" y="27.5" width="28" height="8" rx="4" fill="#1a1a1a"/>
  <circle cx="26" cy="31.5" r="2.7" fill="#fff"/>
  <circle cx="38" cy="31.5" r="2.7" fill="#fff"/>
  <circle cx="27" cy="31.8" r="1.3" fill="#1a1a1a"/>
  <circle cx="39" cy="31.8" r="1.3" fill="#1a1a1a"/>
  <!-- sneaky smirk -->
  <path d="M27 41 Q32 43.5 37.5 39.5" stroke="#7a3b2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>

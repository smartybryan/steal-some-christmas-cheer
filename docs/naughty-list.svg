<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Santa's naughty list">
  <!-- parchment -->
  <rect x="13" y="8" width="38" height="47" rx="2" fill="#fff6e0" stroke="#d9c39a" stroke-width="1.2"/>
  <!-- scroll rolls -->
  <rect x="10" y="4" width="44" height="8" rx="4" fill="#e9d4a8" stroke="#c9ad7a" stroke-width="1"/>
  <rect x="10" y="52" width="44" height="8" rx="4" fill="#e9d4a8" stroke="#c9ad7a" stroke-width="1"/>
  <!-- title -->
  <text x="32" y="20.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="7.4" fill="#c8102e" letter-spacing=".3">NAUGHTY</text>
  <text x="32" y="27" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="5" fill="#1b6b45" letter-spacing="1.2">LIST</text>
  <!-- names, each crossed with a red X -->
  <g stroke-linecap="round">
    <path d="M17.5 31 l3.4 3.4 m0 -3.4 l-3.4 3.4" stroke="#c8102e" stroke-width="1.6"/>
    <path d="M24 32.7 H45" stroke="#9c8660" stroke-width="1.6"/>
    <path d="M17.5 37.6 l3.4 3.4 m0 -3.4 l-3.4 3.4" stroke="#c8102e" stroke-width="1.6"/>
    <path d="M24 39.3 H41" stroke="#9c8660" stroke-width="1.6"/>
    <path d="M17.5 44.2 l3.4 3.4 m0 -3.4 l-3.4 3.4" stroke="#c8102e" stroke-width="1.6"/>
    <path d="M24 45.9 H35" stroke="#9c8660" stroke-width="1.6"/>
  </g>
  <!-- pencil adding your name -->
  <g transform="rotate(-38 46 46)">
    <rect x="38" y="43.5" width="15" height="5" rx="1" fill="#f6c544"/>
    <rect x="52" y="43.5" width="3.2" height="5" rx="1" fill="#ff8fa3"/>
    <path d="M38 43.5 L33.5 46 L38 48.5 Z" fill="#f6cba2"/>
    <path d="M35 45.2 L33.5 46 L35 46.8 Z" fill="#2b2118"/>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duck Lawn Sign</title>
  <link rel="icon" href="duck.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { margin: 0; font-family: "Nunito", system-ui, sans-serif; background: #eee; color: #2b2118; }
    .toolbar { max-width: 8.5in; margin: 16px auto; padding: 0 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .toolbar button { font: 800 1rem "Nunito", sans-serif; padding: 10px 18px; border-radius: 999px; border: 0; background: #c8102e; color: #fff; cursor: pointer; }
    .toolbar code { background: #fff; padding: 4px 8px; border-radius: 6px; word-break: break-all; }
    .sign {
      width: 8.5in; height: 11in; max-width: 100%; margin: 0 auto 24px; background: #fff; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center;
      padding: .55in .5in .5in; box-sizing: border-box; overflow: hidden;
      border: .28in solid transparent;
      border-image: repeating-linear-gradient(45deg, #c8102e 0 .3in, #fff .3in .6in, #1b6b45 .6in .9in, #fff .9in 1.2in) 30;
    }
    h1 { font-family: "Mountains of Christmas", cursive; font-size: 1in; line-height: .95; margin: 0; color: #c8102e; }
    h1 span { display: block; color: #1b6b45; font-size: .62in; }
    .duck { width: 2.8in; }
    .scan { display: flex; align-items: center; gap: .35in; text-align: left; }
    #qr { padding: 10px; background: #fff; border: 4px solid #2b2118; border-radius: 12px; }
    #qr img, #qr canvas { display: block; width: 2.4in !important; height: 2.4in !important; }
    .scan p { font-size: .26in; font-weight: 800; margin: 0 0 .08in; max-width: 3.4in; }
    .scan small { font-size: .17in; color: #6d5d4f; display: block; }
    .fine { font-size: .17in; color: #6d5d4f; margin: 0; }
    @media print {
      @page { size: letter; margin: 0; }
      body { background: #fff; }
      .toolbar { display: none; }
      .sign { margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨️ Print sign</button>
    <span>QR code points to: <code id="url"></code></span>
  </div>
  <div class="sign">
    <h1>Steal Me<span>for Some Christmas Cheer!</span></h1>
    <img class="duck" src="duck.svg" alt="">
    <div class="scan">
      <div id="qr"></div>
      <div>
        <p>Got me? Scan to register your heist!</p>
        <small>Then show me off in your front yard so the next neighbor can plan their caper. 🦆🎄</small>
      </div>
    </div>
    <p class="fine">After New Year's, please return me home. Details are on the website.</p>
  </div>
  <script>
    const target = new URL("register.html", location.href).href;
    document.getElementById("url").textContent = target;
    new QRCode(document.getElementById("qr"), { text: target, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M });
  </script>
</body>
</html>
